<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BIQLTabular — model explorer</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="model_data.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel-2: #2d2d30;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --muted: #858585;
    --accent: #4ec9b0;
    --fact: #e06c75;
    --dim: #61afef;
    --bridge: #c678dd;
    --external: #7f848e;
    --standalone: #d19a66;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px; color: var(--text); background: var(--bg);
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 240px 1fr 320px;
    grid-template-rows: 36px 1fr;
    grid-template-areas:
      "topbar  topbar  topbar"
      "left    center  right";
    height: 100vh;
  }
  #topbar {
    grid-area: topbar;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 12px; gap: 16px;
  }
  #topbar .title { font-weight: 600; color: var(--accent); }
  #topbar label { color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #topbar input[type=checkbox] { accent-color: var(--accent); }
  #topbar .spacer { flex: 1; }
  #topbar select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 3px;
  }

  #left, #right {
    background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  #right { border-right: none; border-left: 1px solid var(--border); }

  #left h3, #right h3 {
    margin: 0; padding: 8px 12px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); border-bottom: 1px solid var(--border);
  }

  #perspective-search, #table-search {
    width: calc(100% - 24px);
    margin: 8px 12px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 4px 6px;
  }

  #perspective-list { list-style: none; margin: 0; padding: 0; }
  #perspective-list li {
    padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent;
  }
  #perspective-list li:hover { background: var(--panel-2); }
  #perspective-list li.active {
    background: var(--panel-2); border-left-color: var(--accent); color: var(--accent);
  }
  #perspective-list li .count { color: var(--muted); float: right; font-size: 11px; }

  #center { grid-area: center; position: relative; background: #181818; }
  #cy { width: 100%; height: 100%; }

  #legend {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(37,37,38,0.9); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 4px; font-size: 11px; color: var(--muted);
  }
  #legend .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
  }

  #details { padding: 0 12px 16px; }
  #details .empty { color: var(--muted); padding: 16px 0; }
  #details .name {
    font-size: 15px; font-weight: 600; color: var(--accent);
    padding: 12px 0 4px;
  }
  #details .role { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  #details .desc { color: var(--muted); font-size: 11px; margin-bottom: 12px; line-height: 1.4; }
  #details details {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 3px; margin-bottom: 8px;
  }
  #details summary {
    cursor: pointer; padding: 6px 8px; font-size: 12px; color: var(--text);
    user-select: none;
  }
  #details summary .count { color: var(--muted); float: right; }
  #details .item-list {
    max-height: 300px; overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  #details .item {
    padding: 4px 8px; font-family: "Consolas", monospace; font-size: 11px;
    border-bottom: 1px solid #333;
  }
  #details .item:last-child { border-bottom: none; }
  #details .item .ty { color: var(--muted); float: right; font-size: 10px; }
  #details .item-search {
    width: calc(100% - 16px); margin: 6px 8px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 3px 5px;
  }
  #details .rel-line {
    padding: 4px 8px; font-size: 11px; border-bottom: 1px solid #333;
  }
  #details .rel-line .inactive { color: var(--muted); font-style: italic; }
  #details .rel-line code {
    color: var(--text); background: var(--panel); padding: 0 3px; border-radius: 2px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">BIQLTabular</span>
    <select id="layout-select" title="Layout algorithm">
      <option value="cose">cose (force)</option>
      <option value="concentric" selected>concentric (fact-centered)</option>
      <option value="breadthfirst">breadthfirst</option>
      <option value="grid">grid</option>
      <option value="circle">circle</option>
    </select>
    <label><input type="checkbox" id="toggle-externals" checked /> external dims</label>
    <label><input type="checkbox" id="toggle-inactive" checked /> inactive relationships</label>
    <span class="spacer"></span>
    <span id="status" style="color: var(--muted); font-size: 11px;"></span>
  </div>

  <div id="left">
    <h3>Perspectives</h3>
    <input id="perspective-search" placeholder="filter…" />
    <ul id="perspective-list"></ul>
  </div>

  <div id="center">
    <div id="cy"></div>
    <div id="legend">
      <div><span class="dot" style="background: var(--fact)"></span>fact</div>
      <div><span class="dot" style="background: var(--dim)"></span>dim</div>
      <div><span class="dot" style="background: var(--bridge)"></span>bridge</div>
      <div><span class="dot" style="background: var(--standalone)"></span>standalone</div>
      <div><span class="dot" style="background: var(--external)"></span>external</div>
    </div>
  </div>

  <div id="right">
    <h3>Selected table</h3>
    <div id="details"><div class="empty">Click a table in the graph.</div></div>
  </div>
</div>

<script>
(function () {
  const data = window.MODEL_DATA;
  const ALL = "(all tables)";

  // ---------- helpers ----------
  function classifyTables(tableNames, rels) {
    const fromN = {}, toN = {};
    tableNames.forEach(n => { fromN[n] = 0; toN[n] = 0; });
    rels.forEach(r => {
      if (fromN[r.from] !== undefined) fromN[r.from]++;
      if (toN[r.to]   !== undefined) toN[r.to]++;
    });
    const out = {};
    tableNames.forEach(n => {
      const f = fromN[n], t = toN[n];
      if (f === 0 && t === 0) out[n] = "standalone";
      else if (f >= 2 && t >= 2) out[n] = "bridge";
      else if (f > t) out[n] = "fact";
      else if (t > 0) out[n] = "dim";
      else out[n] = "fact";
    });
    return out;
  }

  function buildPerspectiveGraph(name, opts) {
    const showExternals = opts.showExternals;
    const showInactive = opts.showInactive;

    let inScopeSet;
    if (name === ALL) {
      inScopeSet = new Set(Object.keys(data.tables));
    } else {
      const p = data.perspectives.find(p => p.name === name);
      inScopeSet = new Set(p.tables);
    }

    // Internal relationships: both endpoints in scope.
    const internal = data.relationships.filter(r =>
      inScopeSet.has(r.from) && inScopeSet.has(r.to)
    );
    // Bridging: in-scope → external dim (only one-direction, fact-out side).
    const bridging = data.relationships.filter(r =>
      inScopeSet.has(r.from) && !inScopeSet.has(r.to)
    );

    let activeRels = internal.slice();
    let externalNames = new Set();
    if (showExternals) {
      activeRels = activeRels.concat(bridging);
      bridging.forEach(r => externalNames.add(r.to));
    }
    if (!showInactive) {
      activeRels = activeRels.filter(r => r.active);
    }

    const allTableNames = [...inScopeSet, ...externalNames];
    const klass = classifyTables(allTableNames, activeRels);
    externalNames.forEach(n => klass[n] = "external");

    const nodes = allTableNames.map(n => {
      const t = data.tables[n] || { columns: [], measures: [] };
      return {
        data: {
          id: n,
          label: n,
          role: klass[n],
          colCount: t.columns.length,
          measureCount: t.measures.length,
        },
      };
    });

    const edges = activeRels.map((r, i) => ({
      data: {
        id: "e" + i,
        source: r.from,
        target: r.to,
        label: r.fromCol === r.toCol ? r.fromCol : `${r.fromCol} → ${r.toCol}`,
        active: r.active,
      },
    }));

    return { nodes, edges, stats: {
      tables: allTableNames.length,
      internal: internal.length,
      bridging: showExternals ? bridging.length : 0,
      rendered: activeRels.length,
    }};
  }

  // ---------- cytoscape ----------
  const cy = cytoscape({
    container: document.getElementById("cy"),
    wheelSensitivity: 0.2,
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(role)",
          "label": "data(label)",
          "color": "#fff",
          "font-size": 11,
          "font-weight": 600,
          "text-valign": "center",
          "text-halign": "center",
          "text-wrap": "wrap",
          "text-max-width": 110,
          "shape": "round-rectangle",
          "width": "label",
          "height": 32,
          "padding": "10px",
          "border-width": 1,
          "border-color": "#000",
        },
      },
      { selector: 'node[role = "fact"]',       style: { "background-color": "#e06c75" } },
      { selector: 'node[role = "dim"]',        style: { "background-color": "#61afef" } },
      { selector: 'node[role = "bridge"]',     style: { "background-color": "#c678dd" } },
      { selector: 'node[role = "external"]',   style: { "background-color": "#7f848e", "opacity": 0.7 } },
      { selector: 'node[role = "standalone"]', style: { "background-color": "#d19a66" } },
      {
        selector: "node:selected",
        style: { "border-color": "#4ec9b0", "border-width": 3 },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#666",
          "target-arrow-color": "#666",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "font-size": 9,
          "color": "#888",
          "label": "data(label)",
          "text-rotation": "autorotate",
          "text-background-color": "#181818",
          "text-background-opacity": 0.8,
          "text-background-padding": 2,
        },
      },
      {
        selector: "edge[active = 'false'], edge[?active][active = false]",
        style: { "line-style": "dashed", "line-color": "#444", "target-arrow-color": "#444" },
      },
      {
        selector: "edge:selected",
        style: { "line-color": "#4ec9b0", "target-arrow-color": "#4ec9b0", "width": 3 },
      },
    ],
  });

  let currentPerspective = "Sales Order";

  function getLayoutOpts() {
    const kind = document.getElementById("layout-select").value;
    const base = { name: kind, animate: false, padding: 30, fit: true };
    if (kind === "cose") {
      return Object.assign(base, {
        nodeRepulsion: 12000, idealEdgeLength: 120, nodeOverlap: 20,
      });
    }
    if (kind === "concentric") {
      return Object.assign(base, {
        concentric: n => {
          const r = n.data("role");
          if (r === "fact") return 4;
          if (r === "bridge") return 3;
          if (r === "dim") return 2;
          if (r === "standalone") return 1;
          return 0; // external on outer ring
        },
        levelWidth: () => 1,
        minNodeSpacing: 40,
      });
    }
    if (kind === "breadthfirst") {
      return Object.assign(base, { directed: true, spacingFactor: 1.3 });
    }
    return base;
  }

  function render() {
    const opts = {
      showExternals: document.getElementById("toggle-externals").checked,
      showInactive: document.getElementById("toggle-inactive").checked,
    };
    const g = buildPerspectiveGraph(currentPerspective, opts);
    cy.elements().remove();
    cy.add(g.nodes);
    cy.add(g.edges);
    cy.layout(getLayoutOpts()).run();
    document.getElementById("status").textContent =
      `${g.stats.tables} tables · ${g.stats.rendered} relationships shown`;
    clearDetails();
  }

  // ---------- side panel ----------
  function clearDetails() {
    document.getElementById("details").innerHTML =
      '<div class="empty">Click a table in the graph.</div>';
  }

  function renderDetails(tableName) {
    const t = data.tables[tableName];
    if (!t) { clearDetails(); return; }

    const rels = data.relationships.filter(r => r.from === tableName || r.to === tableName);

    const role = (cy.$id(tableName).data("role")) || "—";

    const el = document.getElementById("details");
    el.innerHTML = "";

    const h = document.createElement("div");
    h.innerHTML = `
      <div class="name">${escapeHtml(t.name)}</div>
      <div class="role">${role} · ${t.columns.length} columns · ${t.measures.length} measures</div>
      ${t.description ? `<div class="desc">${escapeHtml(t.description)}</div>` : ""}
    `;
    el.appendChild(h);

    el.appendChild(buildList(
      "Columns", t.columns,
      c => `<div class="item">${escapeHtml(c.name)}<span class="ty">${escapeHtml(c.dataType || "")}</span></div>`,
      true
    ));
    el.appendChild(buildList(
      "Measures", t.measures,
      m => `<div class="item">${escapeHtml(m.name)}${m.folder ? `<span class="ty">${escapeHtml(m.folder)}</span>` : ""}</div>`,
      true
    ));

    // Relationships
    const rd = document.createElement("details");
    rd.open = true;
    rd.innerHTML = `<summary>Relationships <span class="count">${rels.length}</span></summary>`;
    const wrap = document.createElement("div");
    wrap.className = "item-list";
    rels.forEach(r => {
      const dir = r.from === tableName ? "→" : "←";
      const other = r.from === tableName ? r.to : r.from;
      const col = r.from === tableName ? r.fromCol : r.toCol;
      const otherCol = r.from === tableName ? r.toCol : r.fromCol;
      const inactive = r.active ? "" : " <span class='inactive'>(inactive)</span>";
      wrap.innerHTML += `<div class="rel-line"><code>${escapeHtml(col)}</code> ${dir} <code>${escapeHtml(other)}.${escapeHtml(otherCol)}</code>${inactive}</div>`;
    });
    rd.appendChild(wrap);
    el.appendChild(rd);
  }

  function buildList(title, items, renderItem, collapsed) {
    const d = document.createElement("details");
    if (!collapsed) d.open = true;
    d.innerHTML = `<summary>${title} <span class="count">${items.length}</span></summary>`;
    if (items.length > 20) {
      const search = document.createElement("input");
      search.className = "item-search";
      search.placeholder = "filter…";
      d.appendChild(search);
      const list = document.createElement("div");
      list.className = "item-list";
      list.innerHTML = items.map(renderItem).join("");
      d.appendChild(list);
      search.addEventListener("input", () => {
        const q = search.value.toLowerCase();
        const filtered = items.filter(it => it.name.toLowerCase().includes(q));
        list.innerHTML = filtered.map(renderItem).join("");
      });
    } else {
      const list = document.createElement("div");
      list.className = "item-list";
      list.innerHTML = items.map(renderItem).join("");
      d.appendChild(list);
    }
    return d;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // ---------- sidebar ----------
  function renderPerspectiveList(filter) {
    const ul = document.getElementById("perspective-list");
    ul.innerHTML = "";
    const f = (filter || "").toLowerCase();

    const items = [{ name: ALL, count: Object.keys(data.tables).length }]
      .concat(data.perspectives.map(p => ({ name: p.name, count: p.tables.length })));

    items
      .filter(it => !f || it.name.toLowerCase().includes(f))
      .forEach(it => {
        const li = document.createElement("li");
        li.textContent = it.name;
        const c = document.createElement("span");
        c.className = "count";
        c.textContent = it.count;
        li.appendChild(c);
        if (it.name === currentPerspective) li.classList.add("active");
        li.addEventListener("click", () => {
          currentPerspective = it.name;
          renderPerspectiveList(document.getElementById("perspective-search").value);
          render();
        });
        ul.appendChild(li);
      });
  }

  // ---------- events ----------
  cy.on("tap", "node", evt => renderDetails(evt.target.id()));
  cy.on("tap", evt => { if (evt.target === cy) clearDetails(); });

  document.getElementById("perspective-search")
    .addEventListener("input", e => renderPerspectiveList(e.target.value));
  document.getElementById("toggle-externals").addEventListener("change", render);
  document.getElementById("toggle-inactive").addEventListener("change", render);
  document.getElementById("layout-select").addEventListener("change", render);

  // ---------- boot ----------
  renderPerspectiveList("");
  render();
})();
</script>
</body>
</html>
